name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      # The pre-commit hook formats staged files, which leaves two gaps: a
      # clone without hooks installed, and files committed before the hooks
      # existed. Both went unnoticed until a whole-repo run turned them up.
      - name: Check formatting with ruff
        run: uv run ruff format --check .

      # Proves the migrations actually apply to an empty database. The test
      # suite covers drift between models and migrations; this covers the
      # revisions themselves running end to end, which is what a deployment
      # does and what a broken revision would break.
      - name: Run migrations against a fresh database
        env:
          LIBRA_DATABASE_URL: sqlite:///./ci-migrations.db
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  # Runs independently of the backend job: the client has no Python and the
  # backend has no TypeScript, so a failure in one should not hide the other.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # The counterpart of `ruff format --check`, and for the same reason:
      # hooks are not installed in a fresh clone.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Separate from the client job because it needs a browser, which costs a
  # download the other checks should not wait on.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium alone. The app is desktop-only by design and self-hosted on a
      # home network, so three engines would triple this job for a risk the
      # project does not carry.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Login and session expiry are the first client milestone to fetch
      # anything, so this is the first e2e run that needs a real backend
      # behind it rather than FakeLibraApi — a real cookie, a real Argon2
      # hash, `npm run dev`'s own proxy carrying the session across the two
      # ports. Seeded the same non-interactive way `scripts/run.sh --scratch`
      # seeds one, in a database this job creates and the runner discards.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --all-groups
        working-directory: backend

      - name: Start a scratch backend for e2e
        working-directory: backend
        env:
          LIBRA_DATABASE_URL: sqlite:///./e2e-scratch/libra.db
          LIBRA_LIBRARY_DIR: ./e2e-scratch/library
          LIBRA_ADMIN_USERNAME: e2e-admin
          LIBRA_ADMIN_PASSWORD: e2e-password
        run: |
          mkdir -p e2e-scratch/library
          uv run python -m app.cli create-admin --username e2e-admin --if-missing
          nohup uv run uvicorn app.main:app --port 8000 > e2e-scratch/uvicorn.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend never became healthy:" >&2
          cat e2e-scratch/uvicorn.log >&2
          exit 1

      - name: Run end-to-end tests
        run: npm run e2e
