name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      # The pre-commit hook formats staged files, which leaves two gaps: a
      # clone without hooks installed, and files committed before the hooks
      # existed. Both went unnoticed until a whole-repo run turned them up.
      - name: Check formatting with ruff
        run: uv run ruff format --check .

      # Proves the migrations actually apply to an empty database. The test
      # suite covers drift between models and migrations; this covers the
      # revisions themselves running end to end, which is what a deployment
      # does and what a broken revision would break.
      - name: Run migrations against a fresh database
        env:
          LIBRA_DATABASE_URL: sqlite:///./ci-migrations.db
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  # Runs independently of the backend job: the client has no Python and the
  # backend has no Dart, so a failure in one should not hide the other.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the lockfile and `.dart_tool` were generated
      # with. `channel: stable` alone would silently move under the project.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The client's counterpart to `ruff format --check`, and for the same
      # reason: hooks are not installed in a fresh clone.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
