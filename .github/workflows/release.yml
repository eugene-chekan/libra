name: Release

# Publishes the image to GHCR and creates a GitHub Release when the version in
# backend/pyproject.toml has no tag yet. So merging the version-bump PR is the
# release. Every other push to main stops after the first job.
#
# Run it by hand (Actions tab, "Run workflow") for a dry run: it builds both
# platforms and publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A second push waits, then finds the tag and stops.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      minor: ${{ steps.read.outputs.minor }}
      build: ${{ steps.read.outputs.build }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and look for its tag
        id: read
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version '$version' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "build=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          fi

  ci:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag and the release
      packages: write   # the image
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The built-in token is enough, so there is no secret to create.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.2.4, 0.2 and latest. No plain `0`: while the project is 0.x it
      # would promise more stability than a minor bump gives.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=latest

      # The source label is what links the package to this repository.
      - name: Build, and push unless this is a dry run
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LIBRA_BUILD=${{ needs.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed push leaves no tag behind and a re-run can try
      # again. `--target` pins the tag to the commit this run built.
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
