[project]
name = "libra-backend"
version = "0.1.0"
description = "Local personal ebook management system - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    # >=1.9 for `alembic check`, which CI uses to catch models drifting
    # ahead of migrations.
    "alembic>=1.9",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # httpx2 rather than httpx: starlette.testclient does
    # `import httpx2 as httpx`, falling back to httpx with a deprecation
    # warning. Same library, new distribution name for its 2.x line.
    "httpx2>=2.9.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag", "agent"]

# The app migrates on startup, so a wheel without the revision scripts starts
# and immediately fails. They go *inside* the package rather than beside it
# because `site-packages/alembic.ini` would be a stray file in a shared
# directory — and because `script_location = %(here)s/alembic` then resolves
# relative to the package, wherever it was installed.
#
# The built client needs no entry here: `scripts/run.sh` writes it to
# `app/web`, which is already inside the package and therefore already
# included. Listing it as well makes hatchling add every file twice and fail.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "app/alembic"
"alembic.ini" = "app/alembic.ini"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI's Depends() in argument defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
