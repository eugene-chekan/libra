services:
  backend:
    # `up` pulls this from GHCR when it is not on the machine yet, and
    # `up --build` builds it from this checkout instead. Set LIBRA_VERSION to
    # run a fixed release: `LIBRA_VERSION=0.2.4 docker compose ... up -d`.
    image: ghcr.io/eugene-chekan/libra:${LIBRA_VERSION:-latest}
    build:
      # The repository root, not backend/: the image builds the client from web/.
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - libra_data:/app/data
    environment:
      LIBRA_DATABASE_URL: sqlite:////app/data/libra.db
      # Uploaded books live on the same volume as the database, so a container
      # restart doesn't leave rows pointing at files that no longer exist.
      LIBRA_LIBRARY_DIR: /app/data/library

volumes:
  libra_data:
